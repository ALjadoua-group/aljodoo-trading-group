  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC3BQg3ZCdhkNRwchrVk1EUgWcIOTUvU7A",
      authDomain: "aljodoo-trading-group.firebaseapp.com",
      projectId: "aljodoo-trading-group",
      storageBucket: "aljodoo-trading-group.firebasestorage.app",
      messagingSenderId: "363183271165",
      appId: "1:363183271165:web:a50e70aec58ad45d396294",
      measurementId: "G-660H2WYXVB"
    };

    const fbApp = initializeApp(firebaseConfig);
    const db = getFirestore(fbApp);
    const dataRef = doc(db, "aljodoo", "daily_data");

    window.__fbSkipNextRemote = false;

    window.__fbSaveData = function(obj){
      window.__fbSkipNextRemote = true;
      setDoc(dataRef, { data: obj, updatedAt: Date.now() }).catch(function(e){
        console.error("Firebase save error:", e);
      });
    };

    window.__fbSubscribe = function(callback){
      onSnapshot(dataRef, function(snap){
        if (window.__fbSkipNextRemote) { window.__fbSkipNextRemote = false; return; }
        if (snap.exists()) {
          var d = snap.data();
          if (d && d.data) callback(d.data);
        }
      }, function(err){
        console.error("Firebase sync error:", err);
      });
    };

  <script>
  (function(){
    var CATS = [
      {key:"malab", label:"الملعب", waredArrs:function(d){return [d.malab?.hujuzat, d.malab?.taira]}, sahbArrs:function(d){return [d.malab?.sahb]}},
      {key:"hawatif", label:"الهواتف والموبايلات", waredArrs:function(d){return [d.hawatif?.wared]}, sahbArrs:function(d){return [d.hawatif?.sahb]}},
      {key:"albisa", label:"الألبسة", waredArrs:function(d){return [d.albisa?.wared]}, sahbArrs:function(d){return [d.albisa?.sahb]}},
      {key:"super", label:"الغذائية", waredArrs:function(d){return [d.super?.sabah, d.super?.masai]}, sahbArrs:function(d){return [d.super?.sahb]}},
      {key:"idara", label:"الإدارة", waredArrs:function(d){return [d.idara?.wared]}, sahbArrs:function(d){return [d.idara?.sahb]}},
      {key:"electronic", label:"الدفع الإلكتروني", waredArrs:function(d){return [d.electronic?.ida]}, sahbArrs:function(d){return [d.electronic?.sahb]}}
    ];
    function toWestern(s){ return String(s||"").replace(/[\u0660-\u0669]/g, function(ch){return String(ch.charCodeAt(0)-0x0660);}); }
    function parseDMY(s){
      var t = toWestern(s).replace(/[^\d]+/g," ").trim();
      var parts = t.split(" ").filter(Boolean);
      if(parts.length < 3) return null;
      return { y: parts[2], m: parts[1].length===1 ? "0"+parts[1] : parts[1] };
    }
    function sumMatching(arr, matchFn){
      if(!Array.isArray(arr)) return 0;
      return arr.reduce(function(a,r){
        var pd = parseDMY(r.date);
        if(!pd) return a;
        return a + (matchFn(pd) ? (r.amount||0) : 0);
      },0);
    }
    function fmt(n){ return Math.round(n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, "،"); }
    function getAllData(){
      try{ var raw = localStorage.getItem("taswiya_data"); return raw ? JSON.parse(raw) : {}; }catch(e){ return {}; }
    }
    function buildReport(mode, val){
      var data = getAllData();
      var matchFn = mode === "month" ? function(pd){ return (pd.y+"-"+pd.m) === val; } : function(pd){ return pd.y === val; };
      var totals = {};
      CATS.forEach(function(c){
        var w = 0, s = 0;
        c.waredArrs(data).forEach(function(arr){ w += sumMatching(arr, matchFn); });
        c.sahbArrs(data).forEach(function(arr){ s += sumMatching(arr, matchFn); });
        totals[c.key] = {label:c.label, wared:w, sahb:s};
      });
      return totals;
    }
    function renderTable(totals){
      var html = '<table style="width:100%;border-collapse:collapse;font-size:13px">';
      html += '<tr style="background:#F1F5F9"><th style="padding:8px;text-align:right">القسم</th><th style="padding:8px;text-align:right">الوارد</th><th style="padding:8px;text-align:right">السحب</th><th style="padding:8px;text-align:right">الصافي</th></tr>';
      var totW=0, totS=0;
      Object.keys(totals).forEach(function(k){
        var t = totals[k];
        totW += t.wared; totS += t.sahb;
        html += '<tr style="border-bottom:1px solid #eee"><td style="padding:8px">'+t.label+'</td><td style="padding:8px">'+fmt(t.wared)+'</td><td style="padding:8px">'+fmt(t.sahb)+'</td><td style="padding:8px;font-weight:700">'+fmt(t.wared-t.sahb)+'</td></tr>';
      });
      html += '<tr style="background:#FFF7D6;font-weight:800"><td style="padding:8px">الإجمالي</td><td style="padding:8px">'+fmt(totW)+'</td><td style="padding:8px">'+fmt(totS)+'</td><td style="padding:8px">'+fmt(totW-totS)+'</td></tr>';
      html += '</table>';
      return html;
    }

    var css = document.createElement("style");
    css.textContent = "\
      #reportFab{position:fixed;bottom:18px;left:18px;z-index:99998;width:52px;height:52px;border-radius:50%;background:#1e3a8a;color:#fff;border:none;box-shadow:0 6px 18px rgba(0,0,0,.25);font-size:22px;cursor:pointer;}\
      #reportModal{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5);padding:16px;}\
      #reportModal.open{display:flex;}\
      #reportModal .box{background:#fff;border-radius:18px;padding:20px;max-width:480px;width:100%;max-height:85vh;overflow:auto;direction:rtl;font-family:inherit;}\
      #reportModal h2{font-size:15px;font-weight:800;margin:0 0 12px;}\
      #reportModal .row{display:flex;gap:8px;margin-bottom:12px;}\
      #reportModal select,#reportModal input{flex:1;height:38px;border-radius:10px;border:1px solid #ddd;padding:0 10px;font-size:13px;}\
      #reportModal button.gen{background:#1e3a8a;color:#fff;border:none;border-radius:10px;padding:0 16px;font-size:13px;font-weight:700;cursor:pointer;}\
      #reportModal button.close{margin-top:14px;width:100%;height:38px;border-radius:10px;border:1px solid #ddd;background:#f5f5f5;font-size:13px;cursor:pointer;}\
    ";
    document.head.appendChild(css);

    var fab = document.createElement("button");
    fab.id = "reportFab"; fab.title = "التقرير الشهري/السنوي"; fab.textContent = "📊";
    document.body.appendChild(fab);

    var modal = document.createElement("div");
    modal.id = "reportModal";
    var now = new Date();
    var curMonth = now.toISOString().slice(0,7);
    var curYear = now.toISOString().slice(0,4);
    modal.innerHTML =
      '<div class="box">' +
        '<h2>التقرير الشهري / السنوي</h2>' +
        '<div class="row">' +
          '<select id="repMode"><option value="month">شهري</option><option value="year">سنوي</option></select>' +
          '<input id="repMonth" type="month" value="'+curMonth+'">' +
          '<input id="repYear" type="number" value="'+curYear+'" style="display:none">' +
          '<button class="gen" id="repGen">عرض</button>' +
        '</div>' +
        '<div id="repResult"></div>' +
        '<button class="close" id="repClose">إغلاق</button>' +
      '</div>';
    document.body.appendChild(modal);

    var repMode = modal.querySelector("#repMode");
    var repMonth = modal.querySelector("#repMonth");
    var repYear = modal.querySelector("#repYear");
    var repResult = modal.querySelector("#repResult");

    repMode.addEventListener("change", function(){
      if(repMode.value === "month"){ repMonth.style.display=""; repYear.style.display="none"; }
      else { repMonth.style.display="none"; repYear.style.display=""; }
    });

    function generate(){
      var mode = repMode.value;
      var val = mode === "month" ? repMonth.value : repYear.value;
      if(!val) return;
      var totals = buildReport(mode, val);
      repResult.innerHTML = renderTable(totals);
    }
    modal.querySelector("#repGen").addEventListener("click", generate);
    fab.addEventListener("click", function(){ modal.classList.add("open"); generate(); });
    modal.querySelector("#repClose").addEventListener("click", function(){ modal.classList.remove("open"); });
  })();
  </script>
  <script>(function(){function m(a){var h=a.getAttribute("href");if(!h)return;try{var u=new URL(h,document.baseURI);if((u.protocol==="http:"||u.protocol==="https:")&&u.host!==location.host){a.target="_blank";a.rel="noopener noreferrer";}}catch(e){}}function s(){document.querySelectorAll("a[href]").forEach(m);}if(document.readyState!=="loading"){s();}else{document.addEventListener("DOMContentLoaded",s);}document.addEventListener("click",function(e){var a=e.target&&e.target.closest&&e.target.closest("a[href]");if(a){m(a);}},true);})();</script>
  
</body>
</html>
