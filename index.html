<body>
  <div id="root"></div>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, setDoc, deleteDoc, onSnapshot, collection, getDocs, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC3BQg3ZCdhkNRwchrVk1EUgWcIOTUvU7A",
      authDomain: "aljodoo-trading-group.firebaseapp.com",
      projectId: "aljodoo-trading-group",
      storageBucket: "aljodoo-trading-group.firebasestorage.app",
      messagingSenderId: "363183271165",
      appId: "1:363183271165:web:a50e70aec58ad45d396294",
      measurementId: "G-660H2WYXVB"
    };

    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

    const fbApp = initializeApp(firebaseConfig);
    let db;
    try{
      db = initializeFirestore(fbApp, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
    }catch(e){
      console.error("Firestore offline cache init failed, falling back to memory cache:", e);
      db = initializeFirestore(fbApp, {});
    }
    const dataRef = doc(db, "aljodoo", "daily_data");
    const usersRef = doc(db, "aljodoo", "users_data");
    const auth = getAuth(fbApp);

    window.__fbAuthReady = new Promise(function(resolve){
      onAuthStateChanged(auth, function(user){
        if (user) resolve(user);
      });
    });
    signInAnonymously(auth).catch(function(e){
      console.error("Firebase auth error:", e);
    });

    // نظام مستندات مستقلة لكل عملية يومية (بدل مستند daily_data واحد يُكتب فوقه بالكامل).
    const txCol = collection(db, "aljodoo_tx");
    const naqdRef = doc(db, "aljodoo_settings", "naqd");

    // ترحيل تلقائي لمرة واحدة من المستند القديم daily_data إلى مستندات مستقلة.
    window.__fbAuthReady.then(async function(){
      try{
        const txSnap = await getDocs(txCol);
        if (txSnap.empty) {
          const oldSnap = await getDoc(dataRef);
          if (oldSnap.exists()) {
            const oldData = oldSnap.data();
            const c = oldData && oldData.data;
            if (c) {
              const nestedCats = { saderat: ["awaliya","sarfiyat"], waredat: ["khareji","whatsapp"], malab: ["hujuzat","taira","sahb"], hawatif: ["wared","sahb"], albisa: ["wared","sahb"], super: ["sabah","masai","sahb"], idara: ["wared","sahb"], electronic: ["ida","sahb"] };
              for (const cat in nestedCats) {
                for (const sub of nestedCats[cat]) {
                  const arr = c[cat] && c[cat][sub];
                  if (Array.isArray(arr)) {
                    for (const item of arr) {
                      if (item && item.id) await setDoc(doc(txCol, String(item.id)), { ...item, cat, sub });
                    }
                  }
                }
              }
              for (const cat of ["deferred","muhawal"]) {
                if (Array.isArray(c[cat])) {
                  for (const item of c[cat]) {
                    if (item && item.id) await setDoc(doc(txCol, String(item.id)), { ...item, cat, sub: null });
                  }
                }
              }
              if (Array.isArray(c.sharedEntries)) {
                for (const item of c.sharedEntries) {
                  if (item && item.id) await setDoc(doc(txCol, String(item.id)), { ...item, cat: "sharedEntries", sub: null });
                }
              }
              if (c.saderat && typeof c.saderat.naqd === "number") {
                await setDoc(naqdRef, { value: c.saderat.naqd, updatedAt: Date.now() });
              }
            }
          }
        }
      }catch(e){
        console.error("Firebase tx migration error:", e);
      }
    });

    window.__fbSetTx = function(item){
      return trackPending(window.__fbAuthReady.then(function(){
        return setDoc(doc(txCol, String(item.id)), item).catch(function(e){
          console.error("Firebase set tx error:", e);
        });
      }));
    };

    window.__fbDeleteTx = function(id){
      return trackPending(window.__fbAuthReady.then(function(){
        return deleteDoc(doc(txCol, String(id))).catch(function(e){
          console.error("Firebase delete tx error:", e);
        });
      }));
    };

    window.__fbSubscribeTxCollection = function(callback){
      window.__fbAuthReady.then(function(){
        onSnapshot(txCol, function(snap){
          var arr = [];
          snap.forEach(function(d){ arr.push(d.data()); });
          callback(arr, snap.metadata.fromCache);
        }, function(err){
          console.error("Firebase tx sync error:", err);
        });
      });
    };

    window.__fbSetNaqd = function(value){
      return window.__fbAuthReady.then(function(){
        return setDoc(naqdRef, { value: value, updatedAt: Date.now() }).catch(function(e){
          console.error("Firebase set naqd error:", e);
        });
      });
    };

    window.__fbSubscribeNaqd = function(callback){
      window.__fbAuthReady.then(function(){
        onSnapshot(naqdRef, function(snap){
          if (snap.exists()) {
            var d = snap.data();
            callback(d.value || 0);
          }
        }, function(err){
          console.error("Firebase naqd sync error:", err);
        });
      });
    };

    window.__fbClearAllTx = function(){
      return window.__fbAuthReady.then(async function(){
        try{
          const snap = await getDocs(txCol);
          const promises = [];
          snap.forEach(function(d){ promises.push(deleteDoc(d.ref)); });
          await Promise.all(promises);
          await setDoc(naqdRef, { value: 0, updatedAt: Date.now() });
        }catch(e){
          console.error("Firebase clear all error:", e);
        }
      });
    };

    window.__fbPendingCount = 0;
    function trackPending(promise){
      window.__fbPendingCount = (window.__fbPendingCount||0) + 1;
      window.dispatchEvent(new CustomEvent("fb-pending-change", { detail: window.__fbPendingCount }));
      return promise.finally(function(){
        window.__fbPendingCount = Math.max(0, (window.__fbPendingCount||0) - 1);
        window.dispatchEvent(new CustomEvent("fb-pending-change", { detail: window.__fbPendingCount }));
      });
    }

    window.__fbSkipNextRemote = false;

    window.__fbSaveData = function(obj, ts){
      window.__fbSkipNextRemote = true;
      window.__fbAuthReady.then(function(){
        setDoc(dataRef, { data: obj, updatedAt: ts || Date.now() }).catch(function(e){
          console.error("Firebase save error:", e);
        });
      });
    };

    window.__fbSubscribe = function(callback){
      window.__fbAuthReady.then(function(){
        onSnapshot(dataRef, function(snap){
          if (window.__fbSkipNextRemote) { window.__fbSkipNextRemote = false; return; }
          if (snap.exists()) {
            var d = snap.data();
            if (d && d.data) callback(d.data, d.updatedAt || 0);
          }
        }, function(err){
          console.error("Firebase sync error:", err);
        });
      });
    };

    // نظام مستندات مستقلة لكل مستخدم (بدل مستند واحد مشترك يُكتب فوقه بالكامل).
    // كل عملية إضافة/حذف/تعديل تصير على مستند المستخدم نفسه فقط، فما تلغي تعديلات باقي الأجهزة.
    const usersCol = collection(db, "aljodoo_users");

    // ترحيل تلقائي لمرة واحدة: لو المجموعة الجديدة فاضية ولسه فيه بيانات بالمستند القديم، ينسخها كمستندات مستقلة.
    window.__fbAuthReady.then(async function(){
      try{
        const snap = await getDocs(usersCol);
        if (snap.empty) {
          const oldSnap = await getDoc(usersRef);
          if (oldSnap.exists()) {
            const oldData = oldSnap.data();
            if (oldData && Array.isArray(oldData.users)) {
              for (const u of oldData.users) {
                if (u && u.name) {
                  await setDoc(doc(usersCol, u.name), u);
                }
              }
            }
          }
        }
      }catch(e){
        console.error("Firebase users migration error:", e);
      }
    });

    window.__fbSetUser = function(user){
      return trackPending(window.__fbAuthReady.then(function(){
        return setDoc(doc(usersCol, user.name), user).catch(function(e){
          console.error("Firebase set user error:", e);
        });
      }));
    };

    window.__fbDeleteUser = function(name){
      return trackPending(window.__fbAuthReady.then(function(){
        return deleteDoc(doc(usersCol, name)).catch(function(e){
          console.error("Firebase delete user error:", e);
        });
      }));
    };

    window.__fbSubscribeUsersCollection = function(callback){
      window.__fbAuthReady.then(function(){
        onSnapshot(usersCol, function(snap){
          var arr = [];
          snap.forEach(function(d){ arr.push(d.data()); });
          callback(arr);
        }, function(err){
          console.error("Firebase users sync error:", err);
        });
      });
    };

  function toWestern(s){return String(s||"").replace(/[\u0660-\u0669]/g,function(ch){return String(ch.charCodeAt(0)-0x0660);});}

    var s=document.createElement('style');
    s.id='reportStyleV8';
    s.textContent='#reportFab{position:fixed!important;bottom:20px!important;left:20px!important;z-index:9999999!important;width:64px!important;height:64px!important;border-radius:50%!important;background:#1e3a8a!important;color:#fff!important;border:3px solid #fff!important;box-shadow:0 8px 24px rgba(0,0,0,.4)!important;font-size:30px!important;display:flex!important;align-items:center!important;justify-content:center!important;cursor:pointer!important;}#reportModal{position:fixed!important;inset:0!important;z-index:9999998!important;background:rgba(0,0,0,.75)!important;display:none!important;align-items:center!important;justify-content:center!important;padding:12px!important;}#reportModal.open{display:flex!important;}#reportModal .box{background:#fff!important;width:100%!important;max-width:560px!important;max-height:90vh!important;overflow:auto!important;border-radius:16px!important;padding:16px!important;direction:rtl!important;}#reportHeaderBtn{padding:8px 14px!important;border-radius:20px!important;background:#1e3a8a!important;color:#fff!important;border:none!important;font-size:13px!important;font-weight:bold!important;cursor:pointer!important;display:inline-flex!important;align-items:center!important;gap:6px!important;margin-left:8px!important;z-index:9999!important;}';
    document.head.appendChild(s);
  }
  function createModal(){
    if(document.getElementById('reportModal')) return;
    var modal=document.createElement('div');modal.id='reportModal';
    var now=new Date(),curM=(d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'))(now),curY=now.getFullYear();
    modal.innerHTML='<div class="box"><h2 style="text-align:center;font-weight:bold;margin-bottom:12px">التقرير الشهري / السنوي</h2><div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap"><select id="repMode"><option value="day">يومي</option><option value="month" selected>شهري</option><option value="year">سنوي</option></select><input id="repDay" type="date" value="'+(d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'))(now)+'" style="display:none"><input id="repMonth" type="month" value="'+curM+'"><input id="repYear" type="number" value="'+curY+'" style="display:none"><button id="repGen" style="background:#1e3a8a;color:#fff;border:none;border-radius:8px;padding:0 12px;height:38px">عرض</button><button id="repClose" style="background:#e5e7eb;border:none;border-radius:8px;padding:0 12px;height:38px">اغلاق</button></div><div id="repResult"></div><button id="repPrint" style="background:#16a34a;color:#fff;width:100%;margin-top:12px;height:38px;border-radius:8px;border:none">طباعة / PDF</button><div style="margin-top:10px;text-align:center"><a href="./reports.html" style="color:#1e3a8a;font-size:13px;text-decoration:underline">فتح صفحة التقارير المنفصلة (مضمونة)</a></div></div>';
    document.body.appendChild(modal);
    var modeEl=modal.querySelector('#repMode'),dayEl=modal.querySelector('#repDay'),monEl=modal.querySelector('#repMonth'),yrEl=modal.querySelector('#repYear'),resEl=modal.querySelector('#repResult');
    modeEl.addEventListener('change',function(){dayEl.style.display=modeEl.value==='day'?'':'none';monEl.style.display=modeEl.value==='month'?'':'none';yrEl.style.display=modeEl.value==='year'?'':'none';});
    function gen(){var md=modeEl.value,v=md==='day'?dayEl.value:md==='month'?monEl.value:yrEl.value;if(!v)return;var r=buildReport(md,v);resEl.innerHTML=renderTable(r);}
    modal.querySelector('#repGen').addEventListener('click',gen);
    modal.querySelector('#repClose').addEventListener('click',function(){modal.style.display='none';modal.classList.remove('open');});
    modal.querySelector('#repPrint').addEventListener('click',function(){var w=window.open('','_blank');w.document.write('<html dir="rtl"><head><meta charset="UTF-8"><title>تقرير</title><style>body{font-family:Arial;padding:20px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:8px;text-align:right}th{background:#f1f5f9}</style></head><body><h1>مجموعة الجدوع</h1>'+resEl.innerHTML+'</body></html>');w.document.close();setTimeout(function(){w.print();},300);});
    window._repGen=gen;
  }
  function openReport(){
    var r=document.getElementById('root');
    if(r && r.innerText && r.innerText.indexOf('تسجيل الدخول بالنظام المحمي')!==-1 && r.innerText.length<1000){alert('يجب تسجيل الدخول أولا');return;}
    var m=document.getElementById('reportModal');if(m){m.style.display='flex';m.classList.add('open');if(window._repGen)window._repGen();}
  }
  function ensureUI(){
    createModal();
    // header btn
    try{
      if(!document.getElementById('reportHeaderBtn')){
        var btns=document.querySelectorAll('button');
        var tb=null;
        for(var i=0;i<btns.length;i++){if(btns[i].innerText && btns[i].innerText.indexOf('التسوية')!==-1){tb=btns[i];break;}}
        if(tb && tb.parentElement){
          var nb=document.createElement('button');nb.id='reportHeaderBtn';nb.innerHTML='📊 التقارير';
          nb.addEventListener('click',openReport);
          tb.parentElement.insertBefore(nb,tb);
        }
      }
    }catch(e){}
  }
  ensureUI();
  setInterval(function(){ensureUI();var h=document.getElementById('reportHeaderBtn');if(h)h.style.display='inline-flex';},1000);
  window.addEventListener('load',ensureUI);
})();
</script>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); });
  setTimeout(function(){ navigator.serviceWorker.register('./sw.js'); }, 800);
}
</script>
